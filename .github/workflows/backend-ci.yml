name: Backend CI workflow

# execute
on: 
  pull_request:
    branches: [master]

# jobs
jobs:
  # 1. linting job
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend

  # 2. validate models and artifacts
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r backend/requirements.txt
      - name: Verify model artifacts load
        run: python -c "from backend.model.predict import predict_age"
      - name: Import check
        run: python -c "from backend.main import app"
      - name: Smoke test
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -f http://127.0.0.1:8000/